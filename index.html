<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonvoy AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#fff;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #eee}
.logo{width:48px;height:48px;border-radius:50%;background:#f5b301;display:flex;align-items:center;justify-content:center;font-size:28px}
h1{font-size:22px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:12px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap}
.me{align-self:flex-end;background:#d3f8d3}
.ai{align-self:flex-start;background:#f1f1f1}
.music-box{background:#f0eaff;border:1px solid #d5c8ff;padding:14px;border-radius:14px}
.lyrics{background:#fff;padding:12px;border-radius:10px;margin-top:10px;line-height:1.7;white-space:pre-wrap}
.mbtn{border:none;padding:10px 16px;border-radius:20px;cursor:pointer;font-size:15px;margin-right:8px;margin-top:8px}
.play{background:#6a1bff;color:#fff}
.sing{background:#ff2e7e;color:#fff}
.stop{background:#111;color:#fff}
footer{padding:10px 12px 14px;border-top:1px solid #eee}
.input-wrap{display:flex;gap:8px;background:#f1f1f1;border-radius:30px;padding:6px}
#inp{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:10px}
#send{width:42px;height:42px;border-radius:50%;border:none;background:#111;color:#fff;font-size:20px}
.modes{display:flex;gap:8px;justify-content:center;margin-top:10px}
.mode{border:1px solid #ddd;background:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600}
.mode.on{background:#111;color:#fff}
</style>
</head>
<body>
<header><div class="logo">🍞</div><h1>Nonvoy AI</h1></header>
<div id="chat"></div>
<footer>
<div class="input-wrap"><input id="inp" placeholder="Xabar yozing..."><button id="send">↑</button></div>
<div class="modes">
<button class="mode" id="btnRasm">Rasm</button>
<button class="mode" id="btnVideo">Video</button>
<button class="mode" id="btnMusic">Musiqa</button>
</div>
</footer>
<script>
var chat = document.getElementById('chat');
var inp = document.getElementById('inp');
var mode = 'rasm';
var waitingMusic = false;
var waitingImage = false;
var audioCtx = null;
var oscs = [];
var musicId = 0;

function add(text, who){
  var d = document.createElement('div');
  d.className = 'bubble ' + (who === 'me' ? 'me' : 'ai');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
add('Salom! Musiqa tugmasini bosing.', 'ai');

function setMode(m){
  mode = m;
  document.getElementById('btnRasm').classList.toggle('on', m === 'rasm');
  document.getElementById('btnVideo').classList.toggle('on', m === 'video');
  document.getElementById('btnMusic').classList.toggle('on', m === 'music');
  if(m === 'music'){
    waitingMusic = true;
    add('Qanaqa qoshiq yaratay? Masalan: Ona haqida, Quvnoq, Vatan haqida deb yozing.', 'ai');
  }
  if(m === 'rasm'){
    waitingImage = false;
    waitingMusic = false;
  }
}
document.getElementById('btnRasm').addEventListener('click', function(){ setMode('rasm'); });
document.getElementById('btnVideo').addEventListener('click', function(){ setMode('video'); add('Video hozircha rasm kabi ishlaydi. Mavzuni yozing.', 'ai'); });
document.getElementById('btnMusic').addEventListener('click', function(){ setMode('music'); });

function playMelody(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  var notes = [261, 293, 329, 349, 392, 349, 329, 293];
  notes.forEach(function(f, i){
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.4);
    g.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + i * 0.4 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.4 + 0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + i * 0.4);
    o.stop(audioCtx.currentTime + i * 0.4 + 0.4);
    oscs.push(o);
  });
}
function stopAll(){
  oscs.forEach(function(o){ try{ o.stop(); }catch(e){} });
  oscs = [];
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function makeMusic(prompt){
  musicId++;
  var id = musicId;
  var d = document.createElement('div');
  d.className = 'bubble ai';
  d.innerHTML = '<div class="music-box"><b>Qoshiq: ' + prompt + '</b><div class="lyrics" id="lyr' + id + '">Matn yozilyapti...</div><button class="mbtn play" id="play' + id + '">Faqat kuy</button><button class="mbtn sing" id="sing' + id + '">Kuylash</button><button class="mbtn stop" id="stop' + id + '">Toxtatish</button></div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  playMelody();
  document.getElementById('play' + id).addEventListener('click', playMelody);
  document.getElementById('stop' + id).addEventListener('click', stopAll);
  document.getElementById('sing' + id).addEventListener('click', function(){
    var txt = document.getElementById('lyr' + id).textContent;
    stopAll(); playMelody();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = 'uz-UZ'; u.rate = 0.85;
    speechSynthesis.speak(u);
  });
  fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: prompt + ' mavzusida ozbek tilida qoshiq matni yoz'})})
  .then(function(r){ return r.json(); })
  .then(function(data){ document.getElementById('lyr' + id).textContent = data.reply || 'Konglimda navo yangraydi'; })
  .catch(function(){ document.getElementById('lyr' + id).textContent = 'Konglimda navo yangraydi, Yuragimda bahor gullaydi'; });
}
function send(){
  var t = inp.value.trim();
  if(!t) return;
  add(t, 'me');
  inp.value = '';
  if(waitingMusic){
    waitingMusic = false;
    makeMusic(t);
    return;
  }
  if(mode === 'music'){
    makeMusic(t);
    return;
  }
  if(mode === 'rasm'){
    add('Rasm mavzusi: ' + t + ' — hozir rasm rejimidasiz', 'ai');
    return;
  }
  add('Yozdim: ' + t, 'ai');
}
document.getElementById('send').addEventListener('click', send);
inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') send(); });
</script>
</body>
</html>
