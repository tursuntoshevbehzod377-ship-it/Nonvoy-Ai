<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonvoy AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:fixed;top:0;left:0;right:0;background:#fff;z-index:50}
.header-left{display:flex;align-items:center;gap:10px}
.menu-btn{width:44px;height:44px;border-radius:50%;border:none;background:#f1f1f1;font-size:22px}
.header-title{font-size:20px;font-weight:500}
.glasses-btn{border:none;background:#f1f1f1;border-radius:999px;padding:10px 16px;font-size:15px}
#sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:#fff;box-shadow:2px 0 10px rgba(0,0,0,0.15);padding:20px;transition:0.3s;z-index:99}
#sidebar.open{left:0}
#sidebar h3{margin-top:0}
#sidebar button{display:block;width:100%;padding:12px;margin:8px 0;border:none;border-radius:12px;background:#f1f1f1;text-align:left;font-size:15px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;z-index:90}
#overlay.show{display:block}
#dotsMenu{position:fixed;top:60px;right:14px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.15);padding:8px;display:none;z-index:99;width:180px}
#dotsMenu.show{display:block}
#dotsMenu button{display:block;width:100%;padding:12px;border:none;background:none;text-align:left;font-size:15px}
main{flex:1;display:flex;flex-direction:column;max-width:700px;width:100%;margin:70px auto 0 auto;padding:10px;padding-bottom:140px}
.logo-wrap{text-align:center;margin:70px 0 20px 0}
.logo-img{width:160px;height:160px;object-fit:cover;border-radius:50%;border:4px solid #f5c542;box-shadow:0 10px 25px rgba(0,0,0,0.18)}
.logo-text{font-size:24px;font-weight:bold;margin-top:12px}
.logo-sub{color:#888;font-size:14px}
#chat{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:10px}
.message{max-width:92%;padding:12px 14px;border-radius:18px;line-height:1.5;word-wrap:break-word}
.message.user{background:#e8f5e9;align-self:flex-end}
.message.ai{background:#f1f1f1;align-self:flex-start}
.message.ai img,.message.ai video,.message.ai canvas{width:100%;border-radius:14px;margin-top:10px}
.message.ai a{color:#0a7a42;display:block;margin-top:6px}
.message.ai h3{margin:10px 0 4px 0;font-size:15px;color:#0a7a42}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 12px 16px 12px;z-index:50}
.input-box{max-width:700px;margin:0 auto;display:flex;flex-direction:column;background:#fff;border:1px solid #e5e5e5;border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,0.08);padding:10px}
.input-row{display:flex;align-items:center;gap:8px}
#msg{flex:1;border:none;outline:none;font-size:17px;padding:10px;background:transparent}
.plus-btn{width:42px;height:42px;min-width:42px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.instant-btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 16px}
.send-btn{width:44px;height:44px;min-width:44px;border-radius:50%;border:none;background:#111;color:#fff;font-size:20px}
</style>
</head>

<header>
<div class="header-left">

</div>
<div style="display:flex;gap:8px;align-items:center">

<main>
<div class="logo-wrap" id="logoWrap">
<img class="logo-img" src="https://image.pollinations.ai/prompt/beautiful%20traditional%20Fergana%20Valley%20uzbek%20non%20bread%2C%20round%20golden%20crispy%20lepeshka%20with%20beautiful%20pattern%20in%20middle%2C%20fresh%20from%20tandir%2C%20on%20white%20background%2C%20professional%20food%20photography%2C%20very%20appetizing%2C%20warm%20light?width=600&height=600&seed=777&nologo=true&model=flux" alt="Vodiy Noni - Nonvoy AI">
<div class="logo-text">Nonvoy AI</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("msg");
const button=document.querySelector(".send-btn");
let history=[];
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("overlay").classList.add("show"); }
function toggleDots(){ document.getElementById("dotsMenu").classList.toggle("show"); }
function closeAll(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); document.getElementById("dotsMenu").classList.remove("show"); }
function newChat(){ chat.innerHTML=""; document.getElementById("logoWrap").style.display="block"; history=[]; closeAll(); }
function addMessage(text,type){
  document.getElementById("logoWrap").style.display="none";
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}
function cleanReply(t){
  t=t.replace(/```[\s\S]*?```/g,"");
  t=t.replace(/`{1,3}/g,"");
  t=t.replace(/\*\*/g,"");
  t=t.replace(/!\[.*?\]\(.*?\)/g,"");
  t=t.replace(/\[.*?\]\(.*?\)/g,"");
  t=t.replace(/[.\-_\/\\|Y]{10,}/g,"");
  return t.trim();
}
function shouldMakeImage(msg){
  const t=msg.toLowerCase().trim();
  if(/(rasm|surat|foto|tasvir|chiz|yarat|ko'rsat|korsat|video|animatsiya|image|picture|draw|generate|chizib|yaratib|ko'rsatib)/.test(t)) return true;
  if(/(gul|g'unchak|gunchak|atirgul|lola|non|mushuk|it|kuchuk|mashina|uy|tog'|dengiz|qiz|bola|shahar|osmon|quyosh|oy|daraxt|at|qush|olma|kitob|telefon|robot|samolyot|poezd|kema|yomg'ir|qor|bog'|o'rmon|ko'l|tabiat|hayvon|qishloq|bozor)/.test(t)) return true;
  if(/^(salom|assalom|salomlar|hi|hello|hey|hayr|xayr|qalesan|qandaysan|yaxshimisan|yaxshi|rahmat|tushunarli|ha|yo'q|ok|okey)/.test(t)) return false;
  if(t.includes("?") || /(^|\s)(nima|qanday|nega|nima uchun|kim|qachon|qayerda|qayerga|qayerdan|nechta|necha|qaysi|qanaqa|tushuntir|ayt|yoz|hisobla|tarjima|yordam|maslahat|nima qilish|qanday qilish|bo'ladimi|mumkinmi|kerakmi)/.test(t)) return false;
  if(t.split(" ").length<=2) return false;
  return false;
}
function translate(prompt){
  let e=prompt;
  const dict={qizil:"red",mashina:"car",mushuk:"cat",it:"dog",uy:"house",gul:"flower",gunchak:"rosebud",tog:"mountain",dengiz:"sea",qiz:"girl",bola:"boy",shahar:"city",osmon:"sky",quyosh:"sun",oy:"moon",daraxt:"tree",at:"horse",qush:"bird",olma:"apple",kitob:"book",telefon:"phone",kompyuter:"computer",robot:"robot",samolyot:"airplane",poezd:"train",kema:"ship",yomgir:"rain",qor:"snow",non:"uzbek bread"};
  Object.keys(dict).forEach(k=>{ e=e.replace(new RegExp(k,"gi"),dict[k]); });
  e=e.replace(/g'unchak/gi,"rosebud").replace(/g’unchak/gi,"rosebud");
  return "extremely sharp, crystal clear, high resolution, highly detailed, cinematic lighting, ultra realistic, 8k, professional photography, "+e+", sharp focus, detailed texture, vibrant colors";
}
function makeImageUrl(prompt){
  return "https://image.pollinations.ai/prompt/"+encodeURIComponent(translate(prompt))+"?width=1536&height=1536&seed="+Math.floor(Math.random()*999999)+"&nologo=true&model=flux&enhance=true";
}
function makeVideoFromImage(imgUrl,box){
  const img=new Image();
  img.crossOrigin="anonymous";
  img.src=imgUrl;
  img.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=640; canvas.height=640;
    box.appendChild(canvas);
    const ctx=canvas.getContext("2d");
    const stream=canvas.captureStream(30);
    const chunks=[];
    let mime="video/webm";
    if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) mime="video/webm;codecs=vp9";
    const rec=new MediaRecorder(stream,{mimeType:mime});
    rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    rec.onstop=()=>{
      const blob=new Blob(chunks,{type:"video/webm"});
      const url=URL.createObjectURL(blob);
      const v=document.createElement("video");
      v.src=url; v.controls=true; v.loop=true; v.autoplay=true; v.playsInline=true; v.muted=true;
      v.addEventListener("loadedmetadata",()=>{
        if(v.duration===Infinity){
          v.currentTime=1e7;
          v.ontimeupdate=()=>{ v.currentTime=0; v.ontimeupdate=null; };
        }
      });
      box.appendChild(v);
      const dl=document.createElement("a");
      dl.href=url; dl.download="nonvoy-video.webm"; dl.textContent="Videoni yuklab olish";
      box.appendChild(dl);
    };
    let start=performance.now();
    rec.start(250);
    function draw(now){
      const t=(now-start)/5000;
      if(t>=1){ rec.stop(); return; }
      const zoom=1+t*0.35;
      const w=640*zoom, h=640*zoom;
      const x=(640-w)/2 + Math.sin(t*3)*20;
      const y=(640-h)/2;
      ctx.fillStyle="#000"; ctx.fillRect(0,0,640,640);
      ctx.drawImage(img,x,y,w,h);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  };
}
async function send(){
  const message=input.value.trim();
  if(!message) return;
  input.value="";
  button.disabled=true;
  addMessage(message,"user");
  const box=addMessage("","ai");
  box.textContent="Tayyorlanmoqda...";

    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:message+" [Javobda ASCII rasm, kod blok, ``` ishlatma. Faqat oddiy o'zbekcha matn bilan javob ber.]",history:history})
    });
    const data=await response.json();
    let reply=cleanReply(data.reply || "");
    if(!reply) reply="Mana, pastda rasmini tayyorladim.";
    box.textContent="";
    const h1=document.createElement("h3"); h1.textContent="💬 Matn"; box.appendChild(h1);
    const p=document.createElement("div"); p.textContent=reply; box.appendChild(p);
    history.push({role:"user",content:message},{role:"assistant",content:reply});
    if(shouldMakeImage(message)){
      const h2=document.createElement("h3"); h2.textContent="🖼️ Rasm"; box.appendChild(h2);
      const imgUrl=makeImageUrl(message);
      const img=document.createElement("img");
      img.src=img
