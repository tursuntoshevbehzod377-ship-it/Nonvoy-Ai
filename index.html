<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonvoy AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;min-height:100vh}
header{padding:16px;text-align:center;font-weight:bold;font-size:20px;background:#020617}
main{flex:1;display:flex;flex-direction:column;max-width:700px;width:100%;margin:0 auto;padding:12px}
.welcome{text-align:center;margin:20px 0}
.welcome h1{margin:0;font-size:26px}
.welcome p{color:#94a3b8}
#chat{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:10px}
.message{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.5;word-wrap:break-word}
.message.user{background:#22c55e;color:#000;align-self:flex-end}
.message.ai{background:#1e293b;align-self:flex-start}
.message.ai img{width:100%;border-radius:12px;margin-top:8px}
.message.ai a{color:#22c55e;display:block;margin-top:6px}
.mode-bar{display:flex;gap:8px;margin-bottom:8px}
.mode-btn{flex:1;padding:9px;border-radius:10px;border:none;background:#1e293b;color:#fff;font-weight:bold}
.mode-btn.active{background:#22c55e;color:#000}
.input-area{display:flex;gap:8px}
#msg{flex:1;padding:12px;border-radius:12px;border:none;outline:none;background:#1e293b;color:#fff}
#send{padding:12px 18px;border-radius:12px;border:none;background:#22c55e;font-weight:bold}
footer{text-align:center;padding:10px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>Nonvoy AI</header>
<main>
<div class="welcome">
<h1>Men Nonvoy AI</h1>
<p>Sizga qanday yordam bera olaman?</p>
</div>
<div id="chat"></div>
<div class="mode-bar">
<button class="mode-btn active" data-mode="text" onclick="setMode('text')">Matn</button>
<button class="mode-btn" data-mode="image" onclick="setMode('image')">Rasm</button>
<button class="mode-btn" data-mode="video" onclick="setMode('video')">Video</button>
</div>
<div class="input-area">
<input id="msg" placeholder="Xabar yozing...">
<button id="send" onclick="send()">Yuborish</button>
</div>
</main>
<footer>Nonvoy AI © 2026</footer>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("msg");
const button=document.getElementById("send");
let history=[];
let currentMode="text";
function setMode(m){
  currentMode=m;
  document.querySelectorAll(".mode-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.mode===m);
  });
}
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}
async function send(){
  const message=input.value.trim();
  if(!message) return;
  input.value="";
  button.disabled=true;
  addMessage(message,"user");
  const low=message.toLowerCase();
  const isImage = currentMode==="image" || low.includes("rasm chiz") || low.includes("rasmini chiz") || low.includes("chiz") || low.includes("draw") || low.includes("generate image");
  if(currentMode==="video"){
    addMessage("Video tez orada qo'shiladi. Hozircha Rasm rejimini ishlating.","ai");
    button.disabled=false; input.focus(); return;
  }
  if(isImage){
    let prompt=message.replace(/rasm chiz|rasmini chiz|chiz|draw|generate image/gi,"").trim();
    if(!prompt) prompt=message;
    let engPrompt=prompt;
    const dict={qizil:"red",mashina:"car",mushuk:"cat",it:"dog",uy:"house",gul:"flower",tog:"mountain",dengiz:"sea",qiz:"girl",bola:"boy",shahar:"city",osmon:"sky",quyosh:"sun",oy:"moon",daraxt:"tree",at:"horse",qush:"bird",olma:"apple",kitob:"book",telefon:"phone",kompyuter:"computer",robot:"robot",samolyot:"airplane",poezd:"train",kema:"ship",yomgir:"rain",qor:"snow"};
    Object.keys(dict).forEach(k=>{ engPrompt=engPrompt.replace(new RegExp(k,"gi"),dict[k]); });
    engPrompt="high quality photo of "+engPrompt;
    const imgUrl="https://image.pollinations.ai/prompt/"+encodeURIComponent(engPrompt)+"?width=1024&height=1024&seed="+Math.floor(Math.random()*999999)+"&nologo=true&model=flux";
    const imgDiv=addMessage("","ai");
    imgDiv.textContent="Rasm tayyorlanmoqda...";
    const img=document.createElement("img");
    img.src=imgUrl;
    img.onload=()=>{ imgDiv.textContent=""; imgDiv.appendChild(img); const dl=document.createElement("a"); dl.href=imgUrl; dl.download="nonvoy.png"; dl.textContent="Yuklab olish"; imgDiv.appendChild(dl); };
    img.onerror=()=>{ imgDiv.textContent="Rasm chiqmadi, qayta urinib ko'ring."; };
    history.push({role:"user",content:message},{role:"assistant",content:"Rasm yaratildi: "+prompt});
    button.disabled=false; input.focus(); return;
  }
  const loading=addMessage("Nonvoy AI yozmoqda...","ai");
  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:message,history:history})
    });
    const data=await response.json();
    loading.textContent=data.reply || "Xatolik yuz berdi";
    history.push({role:"user",content:message},{role:"assistant",content:data.reply});
  }catch(e){
    loading.textContent="Xatolik: Qayta urinib ko'ring. API keyni tekshiring.";
  }
  button.disabled=false;
  input.focus();
}
input.addEventListener("keydown",function(e){ if(e.key==="Enter") send(); });
button.addEventListener("click",send);
</script>
</body>
</html>
