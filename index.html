<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonvoy AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#111;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}
.left{display:flex;align-items:center;gap:10px}
.menu{font-size:26px;cursor:pointer;border:none;background:none}
.logo{width:48px;height:48px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #e8a400}
h1{font-size:22px}
.dots{font-size:26px;border:none;background:none;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.bubble{max-width:85%;padding:12px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#d3f8d3}
.ai{align-self:flex-start;background:#f1f1f1}
.bubble img{width:100%;border-radius:12px;margin-top:10px;display:block;max-height:400px;object-fit:cover;cursor:zoom-in}
.label{font-weight:700;margin-bottom:6px;font-size:14px}
.label.green{color:#0a7a2a}
.ask-box{background:#fff7d6;border:1px solid #f5d76e;padding:12px;border-radius:14px}
.ask-box b{color:#8a6d00}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid #ddd;background:#fff;padding:8px 12px;border-radius:20px;cursor:pointer;font-size:14px}
.music-box{background:#f0eaff;border:1px solid #d5c8ff;padding:14px;border-radius:14px;margin-top:8px}
.music-box h3{margin-bottom:8px}
.lyrics{background:#fff;padding:12px;border-radius:10px;margin-top:10px;line-height:1.7;font-style:italic;white-space:pre-wrap}
.mbtn{border:none;padding:10px 16px;border-radius:20px;cursor:pointer;font-size:15px;margin-right:8px;margin-top:8px}
.mbtn.play{background:#6a1bff;color:#fff}
.mbtn.sing{background:#ff2e7e;color:#fff}
.mbtn.dl{background:#fff;border:1px solid #6a1bff;color:#6a1bff}
.mbtn.stop{background:#111;color:#fff}
footer{padding:10px 12px 14px;border-top:1px solid #eee;background:#fff}
.input-wrap{display:flex;align-items:center;gap:8px;background:#f1f1f1;border-radius:30px;padding:6px 6px 6px 12px}
#plus{width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
#inp{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:10px 0}
#send{width:42px;height:42px;border-radius:50%;border:none;background:#111;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.modes{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.mode{border:1px solid #ddd;background:#fff;padding:10px 18px;border-radius:20px;font-size:14px;cursor:pointer;font-weight:600}
.mode.on{background:#111;color:#fff;border-color:#111}
.mode.music-on{background:#6a1bff;color:#fff;border-color:#6a1bff}
.hint{text-align:center;font-size:12px;color:#888;margin-top:6px}
#fileInput{display:none}
.preview-box{margin:8px 12px 0;display:none}
.preview-box img{width:80px;height:80px;object-fit:cover;border-radius:12px;border:2px solid #f5b301}
.preview-box span{font-size:13px;color:#555;margin-left:8px}
#lightbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:16px}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:85vh;border-radius:12px;object-fit:contain}
#lightboxClose{position:absolute;top:14px;right:18px;color:#fff;font-size:34px;cursor:pointer;background:none;border:none}
#lightboxText{color:#fff;margin-top:12px;font-size:14px}
.note{background:#fff3cd;border:1px solid #ffe69c;padding:10px;border-radius:10px;margin-top:10px;font-size:13px;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="left">
    <button class="menu" type="button" onclick="alert('Nonvoy AI')">☰</button>
    <svg class="logo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#e8a400"/><circle cx="50" cy="50" r="44" fill="#f5b301"/><circle cx="50" cy="50" r="36" fill="#f9c83a"/><circle cx="50" cy="50" r="16" fill="#c98a00"/><circle cx="50" cy="50" r="16" fill="none" stroke="#8a5a00" stroke-width="1" stroke-dasharray="3 3"/><g stroke="#8a5a00" stroke-width="2" fill="none"><path d="M50 14 L50 30 M50 70 L50 86 M14 50 L30 50 M70 50 L86 50 M25 25 L36 36 M64 64 L75 75 M75 25 L64 36 M36 64 L25 75"/><circle cx="50" cy="50" r="8" fill="#a06a00"/></g><g fill="#3a2400"><circle cx="42" cy="42" r="1.5"/><circle cx="58" cy="42" r="1.5"/><circle cx="42" cy="58" r="1.5"/><circle cx="58" cy="58" r="1.5"/><circle cx="50" cy="34" r="1.5"/><circle cx="50" cy="66" r="1.5"/></g></svg>
    <h1>Nonvoy AI</h1>
  </div>
  <button class="dots" type="button" onclick="if(confirm('Chatni tozalashni xohlaysizmi?')){document.getElementById('chat').innerHTML='';localStorage.removeItem('nonvoy_chat');}">⋮</button>
</header>

<div id="chat"></div>

<div class="preview-box" id="previewBox">
  <img id="previewImg" src="">
  <span>✅ Rasm tayyor — endi savol yozing</span>
</div>

<footer>
  <div class="input-wrap">
    <button id="plus" type="button">+</button>
    <input id="inp" placeholder="Xabar yozing..." autocomplete="off">
    <button id="send" type="button">↑</button>
  </div>
  <div class="modes">
    <button class="mode on" id="modeRasm" type="button" onclick="setMode('rasm')">🖼️ Rasm</button>
    <button class="mode" id="modeVideo" type="button" onclick="setMode('video')">🎬 Video</button>
    <button class="mode" id="modeMusic" type="button" onclick="setMode('music')">🎵 Musiqa</button>
  </div>
  <div class="hint">Tugmani tanla: Rasm, Video yoki Musiqa</div>
</footer>
<input type="file" id="fileInput" accept="image/*">

<div id="lightbox">
  <button id="lightboxClose" type="button">✕</button>
  <img id="lightboxImg" src="">
  <div id="lightboxText">Yopish uchun rasmga bosing</div>
</div>

<script>
let waitingForImageSubject=false,waitingForMusicSubject=false,videoMode=false,musicMode=false,pendingImageData=null;

const chatEl=document.getElementById('chat'),inp=document.getElementById('inp');

}
function addBubble(text,who,isHtml){const d=document.createElement('div');d.className='bubble '+(who==='me'?'me':'ai');if(isHtml)d.innerHTML=text;else d.textContent=text;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
function saveChat(){try{localStorage.setItem('nonvoy_chat',chatEl.innerHTML);}catch(e){}}

function translateUzToEn(t){let s=' '+t.toLowerCase()+' ';for(const k in dict){s=s.split(k).join(dict[k]);}return s.trim();}
function isQuestion(t){const s=t.toLowerCase().trim();return s.startsWith('nimani')||s.startsWith('nima')||s.startsWith('qanaqa')||s.startsWith('qanday')||s.startsWith('kim')||s.startsWith('qayer')||s.startsWith('qachon')||s.startsWith('necha')||s.includes('?');}

function isImageRequest(t){const s=t.toLowerCase();if(s.includes('chiz')||s.includes('yasab ber')||s.includes('yaratib ber')||s.includes('chizib'))return true;if(s.includes('rasmi')&&!isQuestion(t))return true;if(s.includes('rasmini')&&!isQuestion(t))return true;return false;}
function isVagueMusicRequest(t){const s=t.toLowerCase().trim();return s==='musiqa'||s==='musiqa yarat'||s==='musiqa yaratib ber'||s==='musiqa yasab ber'||s==='kuy'||s==='qoshiq'||s==='musiqa kerak'||s==='musiqa chal';}
function isMusicRequest(t){const s=t.toLowerCase();return s.includes('musiqa')||s.includes('qoshiq')||s.includes('kuy')||s.includes('ohang')||s.includes('ashula');}
function askWhatImage(){waitingForImageSubject=true;addBubble('<div class="label green">Matn</div><div class="ask-box"><b>Qanaqa r
