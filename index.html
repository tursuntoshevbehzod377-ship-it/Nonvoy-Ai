<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vodiy noni</title>
<style>body{margin:0;background:#ffd6e7;font-family:Arial;padding-bottom:90px}header{text-align:center;padding:10px}button{cursor:pointer}.logo{width:100px;height:100px;border-radius:50%;border:4px solid #16a34a;object-fit:cover}h1{color:#15803d;margin:5px}.top{display:flex;justify-content:space-between;padding:0 10px}.top button{background:#fff;border:2px solid #16a34a;border-radius:10px;font-size:22px;padding:4px 10px}.top .y{background:#16a34a;color:#fff}#side{display:none;background:#fff;margin:10px;border-radius:12px;padding:10px;border:2px solid #16a34a}#side div{padding:8px;border-bottom:1px solid #eee}#chat{background:#fff5f8;margin:10px;border-radius:14px;padding:10px;min-height:100px}.msg{padding:9px;border-radius:12px;margin:7px 0;max-width:88%;white-space:pre-wrap;word-break:break-word}.u{background:#16a34a;color:#fff;margin-left:auto}.a{background:#ffe4ef}.msg img{max-width:100%;border-radius:10px;cursor:zoom-in}#form{position:fixed;left:0;right:0;bottom:0;background:#ffd6e7;padding:10px;display:flex;gap:8px;z-index:10}#plus{width:46px;height:46px;border-radius:50%;background:#16a34a;color:#fff;font-size:26px;border:none}#input{flex:1;padding:12px;border-radius:22px;border:2px solid #16a34a;font-size:16px}#send{background:#16a34a;color:#fff;border:none;border-radius:22px;padding:12px 16px;font-size:16px}#prev{display:none;margin:10px;position:relative}#prev img{width:100%;border-radius:10px}#prev button{position:absolute;right:8px;top:8px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:18px}#big{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;align-items:center;justify-content:center}#big img{max-width:95%;max-height:90%;border-radius:12px}</style></head>
<body><header><div class="top"><button onclick="tog()">☰</button><button class="y" onclick="newC()">＋ Yangi</button><button onclick="alert('Vodiy noni — Nonvoy AI')">⋮</button></div>
<img class="logo" src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400"><h1>Vodiy noni</h1><p>Nonvoy AI — rasm chizadi, rasmni tahlil qiladi, darsga javob beradi</p></header>
<div id="side"><b>Oldingi suhbatlar</b><div id="hist"></div></div>
<div id="chat"><div class="msg a">Salom! Men Nonvoy AI man.</div></div>
<div id="prev"><img id="pv"><button onclick="clr()">✕</button></div>
<form id="form" onsubmit="sendMsg(event)"><button type="button" id="plus" onclick="document.getElementById('file').click()">＋</button><input type="file" id="file" accept="image/*" hidden onchange="onFile(event)"><input id="input" placeholder="Yozing..."><button id="send">➤</button></form>
<div id="big" onclick="this.style.display='none'"><img id="bigPic"></div>
<script>
let chats=JSON.parse(localStorage.getItem('nc')||'[[]]'),cur=0,imgData=null,waiting=false;const chat=document.getElementById('chat');
function save(){localStorage.setItem('nc',JSON.stringify(chats));document.getElementById('hist').innerHTML=chats.map((c,i)=>'<div onclick="openC('+i+')">'+((c[0]&&c[0].t?c[0].t.slice(0,30):'Suhbat'))+'</div>').join('');}
function render(){chat.innerHTML=(chats[cur]||[]).map(m=>'<div class="msg '+(m.w==='u'?'u':'a')+'">'+(m.img?'<img src="'+m.img+'" onclick="zoom(this.src)"><br>':'')+m.t+'</div>').join('')||'<div class="msg a">Salom! Men Nonvoy AI man.</div>';}
function add(w,t,img){if(!chats[cur])chats[cur]=[];chats[cur].push({w:w,t:t,img:img||''});save();render();}
function newC(){chats.unshift([]);cur=0;save();render();}
function openC(i){cur=i;render();document.getElementById('side').style.display='none';}
function tog(){let s=document.getElementById('side');s.style.display=s.style.display==='block'?'none':'block';}
function zoom(s){document.getElementById('bigPic').src=s;document.getElementById('big').style.display='flex';}
function clr(){imgData=null;document.getElementById('prev').style.display='none';document.getElementById('file').value='';}
function onFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{imgData=r.result;document.getElementById('pv').src=imgData;document.getElementById('prev').style.display='block';};r.readAsDataURL(f);}
function tr(t){let p=t.toLowerCase();if(p.includes('non'))return 'Uzbek round bread obi-non, golden crust, on wooden table, no people, only bread, photorealistic';if(p.includes('gul'))return 'beautiful red roses, colorful flowers in garden, no people, photorealistic';if(p.includes('mushuk'))return 'cute cat, photorealistic';if(p.includes('it'))return 'cute dog, photorealistic';if(p.includes('qiz'))return 'beautiful young Uzbek girl, smiling, traditional dress, photorealistic portrait';if(p.includes('tog'))return 'beautiful mountains, photorealistic';if(p.includes('dengiz'))return 'beautiful sea beach, photorealistic';return t+' photorealistic, beautiful';}
function draw(p){return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(tr(p))+'?width=800&height=1000&nologo=true&seed='+Math.floor(Math.random()*99999);}
async function sendMsg(e){e.preventDefault();let inp=document.getElementById('input');let text=inp.value.trim();let myImg=imgData;if(!text&&!myImg)return;add('u',text||'Bu rasmda nima bor?',myImg);inp.value='';clr();
let low=text.toLowerCase();
if(low.includes('rasm chizib ber')){waiting=true;add('a','Qanaqa rasm chizib beray?');return;}
if(low.includes('qiz')&&low.includes('rasm')){add('a','Chizib beryapman...');add('a','Mana qiz bolani rasmi',draw(text));return;}
if(low.includes('rasm')&&low.includes('chiz')){add('a','Chizib beryapman...');add('a','Mana rasmingiz',draw(text));return;}
if(waiting){waiting=false;add('a','Chizib beryapman...');add('a','Mana rasmingiz',draw(text));return;}
add('a','O‘ylayapman...');
try{let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,image:myImg})});let d=await res.json();let els=document.querySelectorAll('.msg.a');els[els.length-1].textContent=d.reply||d.text||'Javob kelmadi';}catch(err){let els=document.querySelectorAll('.msg.a');els[els.length-1].textContent='Serverda xatolik.';}}
save();render();
</script></body></html>
